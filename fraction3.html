<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ケーキを なかよく わけよう！ レベル3</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームひろば">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6fb; --table:#e0d2f6; --card:#ffffff; --ink:#3b2a4a; --sub:#6e5a7e;
  --berry:#ff5d8f; --sponge:#ffd98a; --crust:#f0b34a; --ok:#2fae6b; --soft:#fff0f5; --newtag:#8a5cf0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#251f33; --table:#302846; --card:#33293b; --ink:#fbeef7; --sub:#d9c3e3; --soft:#43324c; --newtag:#b296ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#251f33; --table:#302846; --card:#33293b; --ink:#fbeef7; --sub:#d9c3e3; --soft:#43324c; --newtag:#b296ff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 20px 20px,var(--table) 6px,transparent 7px);
  background-size:40px 40px;
  color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  font-weight:500;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 16px 28px}
.screen{display:none;flex:1;flex-direction:column;align-items:center;text-align:center}
.screen.on{display:flex}

h1{font-size:clamp(30px,7vw,46px);font-weight:800;line-height:1.25;margin:24px 0 8px;letter-spacing:.04em}
.level{display:inline-block;background:var(--newtag);color:#fff;font-size:20px;font-weight:800;padding:4px 18px;border-radius:999px;margin-top:20px}
.lead{font-size:20px;line-height:1.7;color:var(--sub);margin:8px 0 20px}
.hero{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

button{font-family:inherit;color:inherit;cursor:pointer;border:none}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.go{background:var(--berry);color:#fff;font-size:24px;font-weight:800;padding:16px 44px;border-radius:999px;box-shadow:0 6px 0 #c93a69;margin-top:12px}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #c93a69}

.top{width:100%;display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:50%;background:var(--card);border:2px solid var(--sub);opacity:.5}
.dot.done{background:var(--sponge);border-color:var(--crust);opacity:1}
.dot.now{opacity:1;border-color:var(--berry)}
.stars{font-size:20px;font-weight:800;min-width:64px;text-align:right}

.tag{display:inline-block;font-size:15px;font-weight:800;padding:2px 12px;border-radius:999px;margin-bottom:6px}
.tag.rev{background:var(--sponge);color:#5a3b00}
.tag.new{background:var(--newtag);color:#fff}

.prompt{background:var(--card);border-radius:28px;padding:16px 18px 20px;width:100%;font-size:22px;line-height:1.7;font-weight:800}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:18px 0;width:100%}
.choice{background:var(--card);border-radius:24px;padding:12px;min-width:90px;border:4px solid transparent;transition:transform .15s}
.choice.big{flex:1 1 200px;max-width:300px}
.choice:active{transform:scale(.96)}
.choice.right{border-color:var(--ok);background:var(--soft)}
.choice.wrong{animation:shake .4s;opacity:.45}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pie{display:block;margin:0 auto;max-width:100%;height:auto}
.pie.tap path{cursor:pointer}
.pie text{pointer-events:none}

.maker{background:var(--card);border-radius:28px;padding:14px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.maker.right{outline:4px solid var(--ok)}
.count{font-size:20px;font-weight:800;color:var(--sub)}
.decide{background:var(--newtag);color:#fff;font-size:22px;font-weight:800;padding:12px 36px;border-radius:999px}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:800;font-size:1.4em;line-height:1.05;margin:0 4px}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 6px 2px}
.frac span:last-child{padding-top:2px}
.choice .frac{font-size:38px}
.lbl{margin-top:6px;font-size:18px}

.feedback{display:none;width:100%;background:var(--card);border-radius:28px;padding:18px;border:4px solid var(--ok);font-size:20px;line-height:1.75}
.feedback.on{display:block;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.feedback h2{margin:0 0 6px;font-size:28px;color:var(--ok)}
.hint{min-height:32px;font-size:20px;font-weight:800;color:var(--berry)}

.burst{position:fixed;pointer-events:none;font-size:30px;animation:fly 1s ease-out forwards;z-index:5}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}

.summary{background:var(--card);border-radius:28px;padding:20px;font-size:21px;line-height:1.8;margin:14px 0}
.bigstars{font-size:40px;letter-spacing:3px;line-height:1.3}

@media (prefers-reduced-motion:reduce){.hero,.burst{animation:none}.feedback.on{animation:none}}
.home{align-self:flex-start;display:inline-block;background:var(--card);color:var(--ink);text-decoration:none;font-weight:800;font-size:18px;padding:8px 18px;border-radius:999px;margin-bottom:4px}
.home:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
</style>
</head>
<body>
<main>
  <section class="screen on" id="start">
    <a class="home" href="./index.html">🏠 ひろばへ もどる</a>
    <span class="level">レベル3</span>
    <h1>ケーキを<br>なかよく わけよう！</h1>
    <div class="hero" id="heroCake"></div>
    <p class="lead">こんどは 🍓を 2こ・3こ のせるよ。<br>うえの かずは「いくつぶん」の しるし。<br>ふくしゅうも まざっているよ！</p>
    <button class="go" id="startBtn">はじめる</button>
  </section>

  <section class="screen" id="play">
    <div class="top">
      <div class="dots" id="dots"></div>
      <div class="stars" id="starCount">⭐0</div>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="choices" id="choices"></div>
    <div class="hint" id="hint"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <section class="screen" id="end">
    <a class="home" href="./index.html">🏠 ひろばへ もどる</a>
    <h1>ケーキたつじん<br>たんじょう！</h1>
    <div class="bigstars" id="endStars"></div>
    <div class="summary" id="summary"></div>
    <button class="go" id="againBtn">もういちど あそぶ</button>
  </section>
</main>

<script>
// やくぶん できない ぶんすうだけ（ぶんし 1〜3、ぶんぼ 2〜12）
const UNIT=[2,3,4,5,6,8,10,12];
const VALID=[...UNIT.map(n=>[1,n]),[2,3],[2,5],[3,4],[3,5],[3,8],[3,10]];
const MULTI=VALID.filter(f=>f[0]>1);
const SAMEDEN={3:[1,2],4:[1,3],5:[1,2,3],8:[1,3],10:[1,3]};

const ORDER=[
  ['name1','old'],['nameM','new'],['make','new'],['bigsame','new'],
  ['bigunit','old'],['make','new'],['nameM','new'],['bigsame','new'],
  ['name1','old'],['nameM','new'],['make','new'],['bigsame','new']
];
const TOTAL=ORDER.length;

const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const eq=n=>Array(n).fill(1/n);
const range=m=>Array.from({length:m},(_,i)=>i);
const read=(m,n)=>`${n}ぶんの${m}`;
const frac=(m,n)=>`<span class="frac" aria-label="${read(m,n)}"><span>${m}</span><span>${n}</span></span>`;
const tag=k=>k==='old'?'<span class="tag rev">ふくしゅう</span><br>':'<span class="tag new">あたらしい</span><br>';
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];

function pie(n,hl=[],size=160,tap=false){
  const parts=eq(n),c=size/2,r=size/2-8;
  let a=-Math.PI/2;
  let s=`<svg class="pie${tap?' tap':''}" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" ${tap?'role="group" aria-label="ケーキ"':'aria-hidden="true"'}>`;
  s+=`<circle cx="${c}" cy="${c}" r="${r+5}" fill="var(--crust)"/>`;
  const berry=n>8?size/11:n>4?size/9:size/6;
  parts.forEach((p,i)=>{
    const b=a+p*2*Math.PI;
    const x1=c+r*Math.cos(a),y1=c+r*Math.sin(a),x2=c+r*Math.cos(b),y2=c+r*Math.sin(b);
    const on=hl.includes(i);
    s+=`<path data-i="${i}" d="M${c},${c} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${p>.5?1:0} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${on?'var(--berry)':'var(--sponge)'}" stroke="#fff" stroke-width="${n>8?2.5:3}" stroke-linejoin="round"/>`;
    if(on){const m=(a+b)/2;s+=`<text x="${(c+r*.66*Math.cos(m)).toFixed(1)}" y="${(c+r*.66*Math.sin(m)).toFixed(1)}" font-size="${Math.max(14,berry).toFixed(0)}" text-anchor="middle" dominant-baseline="central">🍓</text>`}
    a=b;
  });
  return s+'</svg>';
}

function distractors(f){
  const [m,n]=f;
  const sameDen=VALID.filter(g=>g[1]===n&&g[0]!==m);
  const sameNum=VALID.filter(g=>g[0]===m&&g[1]!==n).sort((a,b)=>Math.abs(a[1]-n)-Math.abs(b[1]-n));
  const out=[];
  if(sameDen.length)out.push(rnd(sameDen));
  for(const g of sameNum){if(out.length>=2)break;out.push(g)}
  for(const g of shuffle(VALID)){if(out.length>=2)break;if(!same(g,f)&&!out.some(o=>same(o,g)))out.push(g)}
  return out;
}

function makeQ(type,k){
  const T=tag(k);
  if(type==='name1'){
    const n=rnd(UNIT);
    const opts=shuffle([n,...UNIT.filter(x=>x!==n).sort((a,b)=>Math.abs(a-n)-Math.abs(b-n)).slice(0,2)]);
    return{
      prompt:`${T}${pie(n,[0],180)}🍓の ところは どれかな？`,
      choices:opts.map(x=>({html:frac(1,x),ok:x===n})),
      wrongHint:'ぜんぶで いくつに きれているか かぞえてみよう！',
      explain:`${n}こに わけた 1こぶんだから ${frac(1,n)}！`,after:''
    };
  }
  if(type==='nameM'){
    const f=rnd(MULTI),[m,n]=f;
    const opts=shuffle([f,...distractors(f)]);
    return{
      prompt:`${T}${pie(n,range(m),180)}🍓の ところを ぜんぶ あわせると どれかな？`,
      choices:opts.map(g=>({html:frac(g[0],g[1]),ok:same(g,f)})),
      wrongHint:'したは ぜんぶの かず、うえは 🍓の かずだよ！',
      explain:`${n}こに わけた うちの ${m}こぶん。<br>だから ${frac(m,n)}（${read(m,n)}）！<br>うえの かずは「いくつぶん」の しるしだよ。`,after:''
    };
  }
  if(type==='bigsame'){
    const d=+rnd(Object.keys(SAMEDEN));
    const [a,b]=shuffle(SAMEDEN[d]).slice(0,2),big=Math.max(a,b);
    return{
      prompt:`${T}🍓の ところを ぜんぶ たべられるよ。<br>おおいのは どっち？`,
      choices:[a,b].map(m=>({html:pie(d,range(m),140)+`<div class="lbl">${frac(m,d)}</div>`,ok:m===big})),cls:'big',
      wrongHint:'🍓が いくつ のっているか くらべてみて！',
      explain:`おなじ ${d}こに わけた ケーキなら、<br>うえの かずが おおきいほど たくさん たべられる！<br>${frac(big,d)} の かち！`,after:''
    };
  }
  if(type==='bigunit'){
    const [a,b]=shuffle(UNIT).slice(0,2),big=Math.min(a,b);
    return{
      prompt:`${T}🍓の ところを たべられるよ。<br>おおきいのは どっち？`,
      choices:[a,b].map(n=>({html:pie(n,[0],140)+`<div class="lbl">${frac(1,n)}</div>`,ok:n===big})),cls:'big',
      wrongHint:'🍓の いろの ところを くらべてみて！',
      explain:`うえが おなじ 1 なら、したの かずが ちいさいほど おおきい！<br>${frac(1,big)} の かち！`,after:''
    };
  }
  const f=rnd(MULTI),[m,n]=f;
  return{
    make:true,m,n,
    prompt:`${T}${frac(m,n)}（${read(m,n)}）に なるように<br>ケーキを タップして 🍓を のせよう！`,
    explain:`${n}こに わけて、🍓を ${m}こ のせたから ${frac(m,n)}！<br>どこに のせても ${m}こ なら せいかいだよ。`,after:''
  };
}

let ac=null;
function tone(freqs){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
      o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.26);
    });
  }catch(e){}
}

function burst(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  ['🍓','⭐','🎉','🍰','✨','⭐'].forEach((e,i)=>{
    const s=document.createElement('span');s.className='burst';s.textContent=e;
    const ang=i/6*Math.PI*2;
    s.style.left=x+'px';s.style.top=y+'px';
    s.style.setProperty('--dx',Math.cos(ang)*110+'px');s.style.setProperty('--dy',Math.sin(ang)*110+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  });
}

let idx=0,stars=0,q=null,missed=false,done=false,picked=new Set();

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

function renderDots(){
  $('dots').innerHTML=Array.from({length:TOTAL},(_,i)=>`<span class="dot ${i<idx?'done':i===idx?'now':''}"></span>`).join('');
  $('starCount').textContent='⭐'+stars;
}

function renderMaker(){
  $('makerPie').innerHTML=pie(q.n,[...picked],220,true);
  $('makerCount').textContent=`いま 🍓 ${picked.size}こ`;
}

function next(){
  if(idx>=TOTAL)return finish();
  const [type,k]=ORDER[idx];
  q=makeQ(type,k);missed=false;done=false;picked=new Set();
  renderDots();
  $('prompt').innerHTML=q.prompt;
  $('hint').textContent='';
  $('feedback').className='feedback';
  const box=$('choices');box.innerHTML='';
  if(q.make){
    box.innerHTML=`<div class="maker" id="maker"><div id="makerPie"></div><div class="count" id="makerCount"></div><button class="decide" id="decide">これで けってい</button></div>`;
    renderMaker();
    $('makerPie').onclick=e=>{
      if(done)return;
      const p=e.target.closest('path[data-i]');if(!p)return;
      const i=+p.dataset.i;picked.has(i)?picked.delete(i):picked.add(i);
      tone([picked.has(i)?660:440]);renderMaker();
    };
    $('decide').onclick=checkMake;
    return;
  }
  q.choices.forEach(ch=>{
    const b=document.createElement('button');
    b.className='choice'+(q.cls?' '+q.cls:'');
    b.innerHTML=ch.html;
    b.onclick=()=>answer(b,ch.ok);
    box.appendChild(b);
  });
}

function checkMake(){
  if(done)return;
  const c=picked.size;
  if(c!==q.m){
    missed=true;tone([330,262]);
    $('hint').textContent=c===0?'ケーキを タップして 🍓を のせてね！':c<q.m?`おしい！ うえの かずは ${q.m}。あと ${q.m-c}こ！`:`おしい！ 🍓が おおすぎるよ。${q.m}こに しよう！`;
    return;
  }
  $('maker').classList.add('right');$('decide').remove();
  succeed($('maker'));
}

function answer(btn,ok){
  if(done||btn.classList.contains('wrong'))return;
  if(!ok){
    missed=true;btn.classList.add('wrong');
    $('hint').textContent='おしい！ '+q.wrongHint;
    tone([330,262]);return;
  }
  btn.classList.add('right');
  succeed(btn);
}

function succeed(el){
  done=true;
  if(!missed)stars++;
  tone([523,659,784]);burst(el);
  $('hint').textContent='';
  const fb=$('feedback');
  fb.innerHTML=`<h2>${missed?'できたね！':'せいかい！'}</h2>${q.after}<p style="margin:8px 0 14px">${q.explain}</p><button class="go" id="nextBtn">${idx===TOTAL-1?'けっかを みる':'つぎへ'}</button>`;
  fb.className='feedback on';
  $('nextBtn').onclick=()=>{idx++;next()};
  renderDots();
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function finish(){
  $('endStars').textContent='⭐'.repeat(stars)||'🍰';
  $('summary').innerHTML=`${TOTAL}もん中 ${stars}こ ほしを あつめたよ！<br><br>したの かずは「いくつに わけたか」<br>うえの かずは「いくつぶんか」<br>${MULTI.map(f=>frac(f[0],f[1])).join(' ')}<br>もう 🍓を いくつ のせても だいじょうぶ！`;
  show('end');tone([523,659,784,1047]);
}

function start(){idx=0;stars=0;show('play');next()}

$('heroCake').innerHTML=pie(5,[0,1,2],220);
$('startBtn').onclick=start;
$('againBtn').onclick=start;
</script>
</body>
</html>
