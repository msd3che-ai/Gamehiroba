<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲームひろば">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" href="./icon.png">
<title>ゲームひろば</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#7fd3b0; --dot:#9be0c3; --card:#ffffff; --ink:#3b2a4a; --sub:#6e5a7e;
  --berry:#ff5d8f; --sponge:#ffd98a; --crust:#f0b34a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f3a31; --dot:#2a4a3f; --card:#33293b; --ink:#fbeef7; --sub:#d9c3e3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f3a31; --dot:#2a4a3f; --card:#33293b; --ink:#fbeef7; --sub:#d9c3e3;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 24px 24px,var(--dot) 6px,transparent 7px);
  background-size:48px 48px;
  color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  font-weight:500;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:760px;margin:0 auto;padding:20px 18px 40px}

.sign{
  background:var(--card);border-radius:36px;padding:22px 20px 18px;text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.12);margin:12px 0 28px;
}
.sign h1{margin:0;font-size:clamp(42px,11vw,72px);font-weight:800;letter-spacing:.06em;line-height:1.1}
.sign h1 span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
.sign h1 span:nth-child(2){animation-delay:.1s}.sign h1 span:nth-child(3){animation-delay:.2s}
.sign h1 span:nth-child(4){animation-delay:.3s}.sign h1 span:nth-child(5){animation-delay:.4s}
.sign h1 span:nth-child(6){animation-delay:.5s}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-8px)}}
.sign p{margin:8px 0 0;font-size:19px;color:var(--sub)}

h2{font-size:24px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:30px}
.game{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  background:var(--card);color:var(--ink);text-decoration:none;
  border-radius:28px;padding:18px 14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.12);
  transition:transform .12s;
}
.game:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.game:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.icon{font-size:76px;line-height:110px;height:110px}
.badge{font-size:16px;font-weight:800;color:#fff;padding:3px 14px;border-radius:999px}
.game b{font-size:21px;line-height:1.35}
.game small{font-size:16px;color:var(--sub);line-height:1.5}
.soon{border:4px dashed rgba(255,255,255,.8);border-radius:28px;display:flex;align-items:center;justify-content:center;min-height:160px;color:#fff;font-size:20px;font-weight:800;text-align:center;padding:16px}

@media (prefers-reduced-motion:reduce){.sign h1 span{animation:none}}
</style>
</head>
<body>
<main>
  <header class="sign">
    <h1 aria-label="ゲームひろば"><span>ゲ</span><span>ー</span><span>ム</span><span>ひ</span><span>ろ</span><span>ば</span></h1>
    <p>きょうは どれで あそぶ？</p>
  </header>
  <div id="list"></div>
</main>

<script>
// ===== ゲームを ふやすときは、ここに 1行 たすだけ =====
// genre: ジャンル名 / file: ファイル名 / title: なまえ / badge: ラベル / color: ラベルのいろ / note: せつめい
// cake: [わけるかず, 🍓のかず]（ケーキの絵）  または  icon: えもじ（大きな絵文字）
const GAMES = [
  {genre:'🍰 さんすう', file:'fraction1.html', title:'ケーキを なかよく わけよう！', badge:'レベル1', color:'#2fae6b', note:'2・3・4・8人で わけるよ', cake:[4,1]},
  {genre:'🍰 さんすう', file:'fraction2.html', title:'ケーキを なかよく わけよう！', badge:'レベル2', color:'#5b7cfa', note:'12人まで わけるよ',       cake:[12,1]},
  {genre:'🍰 さんすう', file:'fraction3.html', title:'ケーキを なかよく わけよう！', badge:'レベル3', color:'#8a5cf0', note:'🍓を 2こ・3こ のせるよ',   cake:[5,3]},
  {genre:'🗾 しゃかい', file:'todofuken-namae.html', title:'とどうふけん なまえクイズ', badge:'その1', color:'#e04a3a', note:'ヒント・よみかた・ちほうで あてよう', icon:'🗾'},
];
// ===================================================

function cake(n,m,size=110){
  const c=size/2,r=size/2-6;let a=-Math.PI/2,s=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r+4}" fill="var(--crust)"/>`;
  for(let i=0;i<n;i++){
    const b=a+2*Math.PI/n,x1=c+r*Math.cos(a),y1=c+r*Math.sin(a),x2=c+r*Math.cos(b),y2=c+r*Math.sin(b);
    s+=`<path d="M${c},${c} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${i<m?'var(--berry)':'var(--sponge)'}" stroke="#fff" stroke-width="2.5"/>`;
    a=b;
  }
  return s+'</svg>';
}

function pic(g){
  if(g.cake) return cake(...g.cake);
  if(g.icon) return `<span class="icon" aria-hidden="true">${g.icon}</span>`;
  return '';
}

const genres=[...new Set(GAMES.map(g=>g.genre))];
document.getElementById('list').innerHTML=genres.map(gen=>
  `<section><h2>${gen}</h2><div class="grid">`+
  GAMES.filter(g=>g.genre===gen).map(g=>
    `<a class="game" href="./${g.file}">${pic(g)}<span class="badge" style="background:${g.color}">${g.badge}</span><b>${g.title}</b><small>${g.note}</small></a>`
  ).join('')+
  `</div></section>`
).join('')+`<div class="grid"><div class="soon">🎁 あたらしい ゲーム<br>もうすぐ ふえるよ！</div></div>`;
</script>
</body>
</html>
